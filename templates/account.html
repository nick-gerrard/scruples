{{define "title"}}Account{{end}}

{{define "content"}}
<div class="mx-auto w-full max-w-sm">
  <h1 class="text-2xl font-extrabold tracking-tight">Account</h1>
  <p class="mt-1 text-sm text-slate-400">Signed in as <span class="font-medium text-slate-200">{{.User.Username}}</span></p>

  <div class="mt-6 rounded-2xl border border-slate-800 bg-slate-900 p-6">
    <h2 class="mb-4 font-semibold">Change password</h2>

    {{if .Data.Error}}
    <p class="mb-4 rounded-xl bg-red-500/10 px-4 py-3 text-sm text-red-400">{{.Data.Error}}</p>
    {{end}}
    {{if .Data.Success}}
    <p class="mb-4 rounded-xl bg-emerald-500/10 px-4 py-3 text-sm text-emerald-400">{{.Data.Success}}</p>
    {{end}}

    <form method="post" action="/account/password" class="space-y-4">
      <input type="password" name="current_password" placeholder="Current password" required autocomplete="current-password"
             class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none">
      <input type="password" name="new_password" placeholder="New password (6+ characters)" required minlength="6" autocomplete="new-password"
             class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none">
      <input type="password" name="confirm_password" placeholder="Confirm new password" required minlength="6" autocomplete="new-password"
             class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none">
      <button type="submit"
              class="w-full rounded-xl bg-indigo-600 py-3 font-semibold text-white transition hover:bg-indigo-500 active:scale-[0.99]">
        Change password
      </button>
    </form>
  </div>
</div>
{{end}}
