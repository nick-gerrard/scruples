{{define "title"}}Write a card{{end}}

{{define "content"}}
<div class="space-y-6">
  <div>
    <a href="/cards" class="-ml-2 inline-flex min-h-[44px] items-center gap-1 rounded-xl px-2 text-sm font-medium text-primary-soft hover:text-primary-bright">&larr; Back to the deck</a>
    <h1 class="page-title mt-1">Write a dilemma</h1>
    <p class="page-sub">Two parts: first set the scene with a bit of circumstance, then finish with a yes/no question everyone has to answer honestly.</p>
  </div>

  {{if .Data.Error}}
  <p class="alert alert-error">{{.Data.Error}}</p>
  {{end}}

  <form method="post" action="/cards" class="space-y-5">
    <div>
      <label for="circumstance" class="label">The circumstance</label>
      <textarea id="circumstance" name="circumstance" rows="5" required maxlength="2000"
                placeholder="You're at a dinner party and&hellip;"
                class="field">{{.Data.Circumstance}}</textarea>
    </div>
    <div>
      <label for="question" class="label">The question</label>
      <input type="text" id="question" name="question" value="{{.Data.Question}}" required maxlength="300"
             placeholder="Do you &hellip;?"
             class="field">
    </div>
    <button type="submit" class="btn btn-primary btn-lg">Add to the deck</button>
  </form>
</div>
{{end}}
