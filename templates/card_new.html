{{define "title"}}Write a card{{end}}

{{define "content"}}
<div class="space-y-6">
  <div>
    <a href="/cards" class="text-sm font-medium text-indigo-400 hover:text-indigo-300">&larr; Back to the deck</a>
    <h1 class="mt-3 text-3xl font-extrabold tracking-tight">Write a dilemma</h1>
    <p class="mt-2 text-sm text-slate-400">Two parts: first set the scene with a bit of circumstance, then finish with a yes/no question everyone has to answer honestly.</p>
  </div>

  {{if .Data.Error}}
  <p class="rounded-xl bg-red-500/10 px-4 py-3 text-sm text-red-400">{{.Data.Error}}</p>
  {{end}}

  <form method="post" action="/cards" class="space-y-4">
    <div>
      <label for="circumstance" class="mb-1 block text-sm font-medium text-slate-300">The circumstance</label>
      <textarea id="circumstance" name="circumstance" rows="5" required maxlength="2000"
                placeholder="Your spouse has repeatedly made a point about privacy. One evening they leave their phone unlocked on the table and head out for an hour&hellip;"
                class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none">{{.Data.Circumstance}}</textarea>
    </div>
    <div>
      <label for="question" class="mb-1 block text-sm font-medium text-slate-300">The question</label>
      <input type="text" id="question" name="question" value="{{.Data.Question}}" required maxlength="300"
             placeholder="Do you &hellip;?"
             class="w-full rounded-xl border border-slate-700 bg-slate-800 px-4 py-3 text-slate-100 placeholder-slate-500 focus:border-indigo-500 focus:outline-none">
    </div>
    <button type="submit"
            class="w-full rounded-xl bg-indigo-600 py-3 font-semibold text-white transition hover:bg-indigo-500 active:scale-[0.99]">
      Add to the deck
    </button>
  </form>
</div>
{{end}}
