{{define "title"}}Log in{{end}}

{{define "content"}}
<div class="flex min-h-[75vh] items-center justify-center">
  <div class="w-full max-w-sm">
    <div class="mb-6 text-center">
      <img src="/static/brand/logo.svg?v=1" alt="" width="72" height="72" class="mx-auto h-[72px] w-[72px]">
      <div class="mt-3 text-4xl font-extrabold tracking-tight text-primary-soft">Scruples</div>
      <div class="mt-1 text-sm text-muted">the game of moral dilemmas</div>
    </div>

    <div class="card p-6 sm:p-8">
      {{if .Data.Error}}
      <p class="alert alert-error mb-4">{{.Data.Error}}</p>
      {{end}}

      <form method="post" action="/login" class="space-y-4">
        <input type="text" name="username" value="{{.Data.Username}}" placeholder="Username" aria-label="Username" required autocomplete="username" autocapitalize="none" autocorrect="off" class="field">
        <input type="password" name="password" placeholder="Password" aria-label="Password" required autocomplete="current-password" class="field">
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <p class="mt-5 text-center text-sm text-muted">
        New here? <a href="/signup" class="inline-flex min-h-[44px] items-center px-1 font-semibold text-primary-soft hover:text-primary-bright">Sign up</a>
      </p>
    </div>
  </div>
</div>
{{end}}
